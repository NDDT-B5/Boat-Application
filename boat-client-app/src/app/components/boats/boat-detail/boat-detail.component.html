<div class="boat-detail-card mat-elevation-z4">
    <h2>{{ boat?.name }}</h2>
    <p><strong>ID:</strong> {{ boat?.id }}</p>
    <p><strong>Description:</strong> {{ boat?.description }}</p>

    <div class="button-group">
        <button mat-raised-button color="warn" (click)="deleteBoat()" class="mr-16">Delete</button>
        <button mat-raised-button (click)="goBack()">Back to List</button>
    </div>
</div>
